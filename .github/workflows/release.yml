name: Release

# Push a tag like v1.0.0 to build a signed APK and publish it as a GitHub release.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64  the release keystore, base64-encoded
#   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > release.jks
      - name: Build signed APK
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "Passradar-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v3
        with:
          files: Passradar-*.apk
          generate_release_notes: true
